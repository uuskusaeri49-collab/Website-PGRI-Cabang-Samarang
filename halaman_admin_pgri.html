<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - PGRI Samarang</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .admin-header {
            background-color: #343a40;
            color: white;
            padding: 15px 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card-form {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- Header Admin -->
    <header class="admin-header">
        <div class="container d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="fas fa-cogs me-2"></i> Ruang Admin PGRI Samarang</h4>
            <a href="index.html" class="btn btn-outline-light btn-sm" target="_blank"><i class="fas fa-eye me-1"></i> Lihat Website</a>
        </div>
    </header>

    <!-- Konten Utama -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <!-- Alert Notifikasi (Tersembunyi di awal) -->
                <div id="notifikasi" class="alert alert-success d-none shadow-sm" role="alert">
                    <i class="fas fa-check-circle me-2"></i> <strong>Berhasil!</strong> Data postingan telah tersimpan ke Firebase.
                </div>

                <!-- Alert Error (Tersembunyi di awal) -->
                <div id="notifikasiError" class="alert alert-danger d-none shadow-sm" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i> <strong>Gagal!</strong> Data gagal disimpan. Cek koneksi atau aturan Firebase.
                </div>

                <!-- Form Input Berita -->
                <div class="card card-form p-4">
                    <h5 class="fw-bold mb-4 border-bottom pb-3"><i class="fas fa-edit text-primary me-2"></i> Tulis Postingan Baru</h5>
                    
                    <form id="formBerita">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Judul Postingan</label>
                            <input type="text" id="judulBerita" class="form-control" placeholder="Contoh: Rapat Kerja Tahun 2024" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Kategori</label>
                            <select id="kategoriPosting" class="form-select" required>
                                <option value="Berita Kegiatan">Berita Kegiatan</option>
                                <option value="Pojok Karya">Pojok Karya (Artikel Guru)</option>
                                <option value="Pengumuman">Pengumuman</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Penulis / Nama Anda</label>
                            <input type="text" id="penulisBerita" class="form-control" placeholder="Contoh: Bpk. Budi Santoso" required>
                        </div>

                        <!-- KOLOM BARU UNTUK UPLOAD FOTO -->
                        <div class="mb-3">
                            <label class="form-label fw-bold"><i class="fas fa-image text-secondary me-2"></i>Foto Kegiatan (Opsional)</label>
                            <input type="file" id="fotoBerita" class="form-control" accept="image/*">
                            <small class="text-muted">Format: JPG atau PNG. Ukuran ideal maksimal 2MB.</small>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Isi Konten</label>
                            <textarea id="isiBerita" class="form-control" rows="6" placeholder="Ketik isi berita atau artikel di sini..." required></textarea>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" id="btnSimpan" class="btn btn-primary btn-lg fw-bold">
                                <i class="fas fa-paper-plane me-2"></i> Publikasikan Sekarang
                            </button>
                        </div>
                    </form>
                </div>

                <!-- FORM TAMBAH DATA ANGGOTA (BARU) -->
                <div class="card card-form p-4 mt-4 mb-5 border-top border-success border-4">
                    <h5 class="fw-bold mb-4 border-bottom pb-3"><i class="fas fa-user-plus text-success me-2"></i> Tambah Data Anggota (NPA)</h5>
                    
                    <form id="formAnggota">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nomor Pokok Anggota (NPA)</label>
                            <input type="number" id="npaAnggota" class="form-control" placeholder="Contoh: 123456789" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nama Lengkap (Beserta Gelar)</label>
                            <input type="text" id="namaAnggota" class="form-control" placeholder="Contoh: Budi Santoso, S.Pd." required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Unit Kerja / Sekolah</label>
                            <input type="text" id="sekolahAnggota" class="form-control" placeholder="Contoh: SDN 1 Samarang" required>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" id="btnSimpanAnggota" class="btn btn-success btn-lg fw-bold">
                                <i class="fas fa-save me-2"></i> Simpan Data Anggota
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Script Firebase & Logika Simpan Data -->
    <script type="module">
        // 1. Import Alat Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 2. Kunci Firebase Bos Uus
        const firebaseConfig = {
            apiKey: "AIzaSyBy2KzlKK1L4KmOGNiBpy-tZcJAc9ETApM",
            authDomain: "pgri-samarang.firebaseapp.com",
            projectId: "pgri-samarang",
            storageBucket: "pgri-samarang.firebasestorage.app",
            messagingSenderId: "879465219309",
            appId: "1:879465219309:web:f10c0717a4e2e87a7f38e4"
        };

        // 3. Nyalakan Mesin Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 4. Logika ketika tombol "Publikasikan Sekarang" ditekan
        const formBerita = document.getElementById("formBerita");
        const btnSimpan = document.getElementById("btnSimpan");
        const notifikasi = document.getElementById("notifikasi");
        const notifikasiError = document.getElementById("notifikasiError");

        formBerita.addEventListener("submit", async function(e) {
            e.preventDefault(); // Mencegah halaman reload otomatis
            
            // Ubah teks tombol jadi loading
            btnSimpan.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Sedang Menyimpan...';
            btnSimpan.disabled = true;

            // Ambil data dari kotak isian
            const judul = document.getElementById("judulBerita").value;
            const kategori = document.getElementById("kategoriPosting").value;
            const penulis = document.getElementById("penulisBerita").value;
            const isi = document.getElementById("isiBerita").value;
            const fotoInput = document.getElementById("fotoBerita"); // Menangkap file foto

            try {
                let linkGambarUrl = ""; // Wadah kosong untuk foto

                // JURUS PAMUNGKAS: Kompres foto dan tanam langsung ke Firebase (Anti Blokir)
                if (fotoInput.files.length > 0) {
                    btnSimpan.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Memproses Foto...';
                    
                    const fileFoto = fotoInput.files[0];
                    
                    linkGambarUrl = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.readAsDataURL(fileFoto);
                        reader.onload = function(event) {
                            const img = new Image();
                            img.src = event.target.result;
                            img.onload = function() {
                                // Buat kanvas bayangan untuk mengecilkan foto
                                const canvas = document.createElement('canvas');
                                const MAX_WIDTH = 800; // Lebar maksimal gambar agar Firebase tidak berat
                                let width = img.width;
                                let height = img.height;

                                if (width > MAX_WIDTH) {
                                    height = Math.round((height * MAX_WIDTH) / width);
                                    width = MAX_WIDTH;
                                }

                                canvas.width = width;
                                canvas.height = height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, width, height);

                                // Ubah jadi teks (kualitas 70% agar ringan)
                                const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                                resolve(dataUrl);
                            };
                        };
                    });
                }

                btnSimpan.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Menyimpan ke Database...';

                // Perintah simpan ke database (Membuat koleksi bernama "postingan")
                const docRef = await addDoc(collection(db, "postingan"), {
                    judul: judul,
                    kategori: kategori,
                    penulis: penulis,
                    isi: isi,
                    gambar: linkGambarUrl, // Menyimpan link foto (kalau ada)
                    tanggalDibuat: serverTimestamp() // Otomatis catat waktu saat ini
                });

                console.log("Berhasil simpan dengan ID: ", docRef.id);
                
                // Munculkan notifikasi sukses
                notifikasi.classList.remove("d-none");
                
                // Kosongkan form setelah berhasil
                formBerita.reset();
                
                // Hilangkan notifikasi setelah 4 detik
                setTimeout(() => {
                    notifikasi.classList.add("d-none");
                }, 4000);

            } catch (error) {
                console.error("Waduh error Bos: ", error);
                // Munculkan notifikasi gagal (menggantikan fungsi alert)
                notifikasiError.classList.remove("d-none");
                
                // Hilangkan notifikasi error setelah 4 detik
                setTimeout(() => {
                    notifikasiError.classList.add("d-none");
                }, 4000);
            } finally {
                // Kembalikan tombol seperti semula
                btnSimpan.innerHTML = '<i class="fas fa-paper-plane me-2"></i> Publikasikan Sekarang';
                btnSimpan.disabled = false;
            }
        });

        // 5. LOGIKA UNTUK MENYIMPAN DATA ANGGOTA BARU
        const formAnggota = document.getElementById("formAnggota");
        const btnSimpanAnggota = document.getElementById("btnSimpanAnggota");

        formAnggota.addEventListener("submit", async function(e) {
            e.preventDefault(); 
            
            btnSimpanAnggota.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Menyimpan...';
            btnSimpanAnggota.disabled = true;

            const npa = document.getElementById("npaAnggota").value;
            const nama = document.getElementById("namaAnggota").value;
            const sekolah = document.getElementById("sekolahAnggota").value;

            try {
                // Simpan ke koleksi baru bernama "anggota"
                await addDoc(collection(db, "anggota"), {
                    npa: npa,
                    nama: nama,
                    sekolah: sekolah
                });
                
                notifikasi.innerHTML = '<i class="fas fa-check-circle me-2"></i> <strong>Berhasil!</strong> Data Anggota tersimpan.';
                notifikasi.classList.remove("d-none");
                formAnggota.reset();
                setTimeout(() => { notifikasi.classList.add("d-none"); }, 4000);

            } catch (error) {
                console.error("Waduh error Anggota: ", error);
                notifikasiError.innerHTML = '<i class="fas fa-exclamation-triangle me-2"></i> <strong>Gagal!</strong> Periksa koneksi internet Bos.';
                notifikasiError.classList.remove("d-none");
                setTimeout(() => { notifikasiError.classList.add("d-none"); }, 4000);
            } finally {
                btnSimpanAnggota.innerHTML = '<i class="fas fa-save me-2"></i> Simpan Data Anggota';
                btnSimpanAnggota.disabled = false;
            }
        });
    </script>
</body>
</html>
